[project]
name = "mu-board"
version = "0.1.0"
description = "A conversational worker supervisor and ordered task queue for Mu"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mub = "muboard.cli:main"

[tool.setuptools]
packages = ["muboard"]
